<!DOCTYPE html>
<html>
<head>
<title>Rare Cafe</title>
</head>
<h1> Rare Cafe </h1>
<body>
<img src="background.jpg" alt="background">
<div id="menuDisplay"></div>

<form id="welcomeForm" onsubmit="return false;">

   <label>Name:</label>
    <input type="text" id="nameField" placeholder="Enter your name" required>
    <br><br>
     <label>Items:</label>
    <input type="number" id="itemField"  placeholder="Enter item number" required>
    <br><br>
    <label>Money:</label>
    <input type="number" id="moneyField" placeholder="Enter money" required>
    <br><br>

    <input type="submit" value="Add Order" onclick="addOrder()" >
   <input type="submit" value="Place Order" onclick="placeOrder()">
   <input type="submit" value="Reset" onclick="resetOrder()">


  </form> 
  <div id="spaceForJavaScriptOutput"></div>
  
<script src="script.js"></script>
</body>
</html>
